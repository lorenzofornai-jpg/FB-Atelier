<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FB atelier</title>
<meta name="description" content="FB atelier — borse fatte a mano a Roma da Federica. Pezzi unici, uno per modello.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Jost:wght@300;400;500&display=swap">
<style>
/* Layout: a quiet gallery wall. Each bag hangs in a passe-partout frame with a museum label; prices live only in the detail view. */
:root{
  --wall:#f3f0ec;          /* gallery wall, warm grey leaning to plum */
  --wall-2:#e9e4df;        /* recessed panels */
  --mat:#fbfaf8;           /* passe-partout */
  --ink:#231c22;           /* aubergine-black text */
  --ink-soft:#6c6168;      /* captions */
  --line:#d6cec9;          /* hairlines */
  --accent:#7a2e43;        /* deep garnet, from the bags' quilted handles */
  --accent-ink:#fbfaf8;
  --scrim:rgba(30,22,28,.62);
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --body:"Jost","Avenir Next","Segoe UI",system-ui,sans-serif;
  --step--1:.8125rem; --step-0:1rem; --step-1:1.25rem; --step-2:1.75rem; --step-3:clamp(2.25rem,5vw,3.5rem); --step-4:clamp(3rem,9vw,6.5rem);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --wall:#1b171a; --wall-2:#231e22; --mat:#2a2428; --ink:#efe8e6; --ink-soft:#ab9ea5; --line:#3d343a;
  --accent:#d7899c; --accent-ink:#1b171a; --scrim:rgba(8,6,8,.75); color-scheme:dark}}
:root[data-theme="dark"]{
  --wall:#1b171a; --wall-2:#231e22; --mat:#2a2428; --ink:#efe8e6; --ink-soft:#ab9ea5; --line:#3d343a;
  --accent:#d7899c; --accent-ink:#1b171a; --scrim:rgba(8,6,8,.75); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
img{height:auto}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{background:var(--wall);color:var(--ink);font-family:var(--body);font-weight:300;font-size:var(--step-0);line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding-inline:clamp(16px,4vw,48px)}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:1.5px solid var(--accent);outline-offset:3px}
.eyebrow{font-size:var(--step--1);letter-spacing:.22em;text-transform:uppercase;color:var(--ink-soft);font-weight:400}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;line-height:1.1}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--wall) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px}
.mark{font-family:var(--display);font-size:1.35rem;letter-spacing:.04em;text-decoration:none;white-space:nowrap}
.mark i{font-style:italic;color:var(--accent)}
.nav{display:flex;align-items:center;gap:clamp(12px,2.5vw,28px)}
.nav a{font-size:var(--step--1);letter-spacing:.16em;text-transform:uppercase;text-decoration:none;color:var(--ink-soft)}
.nav a:hover{color:var(--ink)}
.lang{display:flex;border:1px solid var(--line)}
.lang button{background:none;border:0;padding:4px 9px;font-size:.75rem;letter-spacing:.12em;color:var(--ink-soft)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--wall)}
.bag-btn{background:none;border:0;display:flex;align-items:center;gap:6px;font-size:var(--step--1);letter-spacing:.12em;text-transform:uppercase;padding:4px 0}
.bag-btn .n{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:.7rem;letter-spacing:0}
.bag-btn .n[data-zero]{background:var(--line);color:var(--ink-soft)}
@media (max-width:640px){.nav .nl{display:none}}

/* hero */
.hero{padding-block:clamp(56px,10vw,120px) clamp(40px,7vw,80px);text-align:left}
.hero h1{font-size:var(--step-4);letter-spacing:-.01em;margin-top:18px}
.hero h1 em{color:var(--accent)}
.hero p{max-width:34rem;margin:28px 0 0;font-size:var(--step-1);color:var(--ink-soft)}
.hero .rule{display:flex;align-items:center;gap:16px;margin-top:40px;color:var(--ink-soft);font-size:var(--step--1);letter-spacing:.18em;text-transform:uppercase}
.hero .rule::before{content:"";width:56px;height:1px;background:var(--ink-soft)}

/* gallery */
.section-head{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:24px;margin-bottom:clamp(32px,5vw,56px)}
.section-head h2{font-size:var(--step-3)}
.section-head p{max-width:26rem;margin:0;color:var(--ink-soft)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(28px,4vw,56px) clamp(20px,3vw,44px)}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
.work{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:18px}
.frame{background:var(--mat);padding:clamp(14px,2vw,22px);box-shadow:0 1px 0 var(--line),0 18px 40px -28px rgba(35,28,34,.45);transition:transform .5s cubic-bezier(.2,.7,.2,1),box-shadow .5s}
.frame img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;max-width:100%}
.work:hover .frame{transform:translateY(-6px);box-shadow:0 1px 0 var(--line),0 30px 50px -30px rgba(35,28,34,.55)}
.label{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;align-items:baseline}
.label .no{font-family:var(--display);font-style:italic;color:var(--accent);font-size:var(--step-1);grid-row:span 2}
.label h3{font-size:var(--step-2)}
.label .meta{font-size:var(--step--1);letter-spacing:.08em;color:var(--ink-soft)}
.work .look{font-size:var(--step--1);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);border-bottom:1px solid transparent;align-self:flex-start;transition:color .3s,border-color .3s}
.work:hover .look{color:var(--accent);border-color:var(--accent)}

/* story */
.story{margin-top:clamp(80px,12vw,150px);background:var(--wall-2)}
.story .wrap{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(32px,6vw,88px);padding-block:clamp(56px,9vw,110px);align-items:center}
@media (max-width:820px){.story .wrap{grid-template-columns:1fr}}
.portrait{margin:0;justify-self:center;width:100%;max-width:360px}
.portrait .frame{transform:rotate(-1.2deg)}
.portrait img{aspect-ratio:4/5}
.portrait figcaption{margin-top:14px;font-size:var(--step--1);color:var(--ink-soft);letter-spacing:.08em}
.story h2{font-size:var(--step-3);margin-top:14px}
.story .lede{font-family:var(--display);font-style:italic;font-size:var(--step-1);color:var(--accent);margin:18px 0 0}
.story .text p{max-width:36rem;margin:18px 0 0}

/* atelier */
.method{padding-block:clamp(72px,10vw,130px)}
.method .cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(24px,4vw,48px);align-items:start}
@media (max-width:820px){.method .cols{grid-template-columns:1fr}}
.method figure{margin:0}
.method figure img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;max-width:100%}
.method figcaption{margin-top:10px;font-size:var(--step--1);color:var(--ink-soft);letter-spacing:.06em}
.promise{display:flex;flex-direction:column;gap:22px}
.promise div{border-top:1px solid var(--line);padding-top:14px}
.promise h3{font-size:var(--step-1)}
.promise p{margin:6px 0 0;color:var(--ink-soft)}

footer{border-top:1px solid var(--line)}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;padding-block:32px;font-size:var(--step--1);color:var(--ink-soft);letter-spacing:.06em}

/* detail sheet */
.sheet{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:clamp(0px,3vw,32px)}
.sheet .scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .35s ease}
.panel{position:relative;background:var(--wall);width:min(1100px,100%);max-height:100%;overflow:auto;display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);animation:rise .45s cubic-bezier(.2,.7,.2,1)}
@media (max-width:820px){.panel{grid-template-columns:1fr;height:100%}}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
.viewer{background:var(--mat);padding:clamp(16px,3vw,32px);display:flex;flex-direction:column;gap:14px}
.viewer .main{width:100%;aspect-ratio:4/5;object-fit:contain;background:var(--wall-2);max-width:100%}
.thumbs{display:flex;gap:10px;flex-wrap:wrap}
.thumbs button{border:1px solid transparent;padding:0;background:none;width:64px}
.thumbs button[aria-current="true"]{border-color:var(--accent)}
.thumbs img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.info{padding:clamp(24px,4vw,48px);display:flex;flex-direction:column;gap:20px;min-width:0}
.close{position:absolute;top:12px;right:12px;z-index:2;width:40px;height:40px;border:1px solid var(--line);background:var(--wall);font-size:1.3rem;line-height:1}
.info h2{font-size:var(--step-3)}
.info .unique{display:inline-flex;align-items:center;gap:10px;font-size:var(--step--1);letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.info .unique::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.info .desc p{margin:0 0 12px}
.specs{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:8px 18px;border-top:1px solid var(--line);padding-top:16px;font-size:.92rem}
.specs dt{color:var(--ink-soft);letter-spacing:.06em}
.specs dd{margin:0}
.buy{border-top:1px solid var(--line);padding-top:20px;display:flex;flex-direction:column;gap:12px}
.price{font-family:var(--display);font-size:var(--step-2);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--wall);padding:14px 22px;letter-spacing:.16em;text-transform:uppercase;font-size:var(--step--1);transition:background .3s,color .3s}
.btn:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn[disabled]{background:none;color:var(--ink-soft);border-color:var(--line);cursor:default}
.btn.ghost{background:none;color:var(--ink)}
.note{font-size:var(--step--1);color:var(--ink-soft);margin:0}

/* cart drawer */
.drawer{position:fixed;inset:0;z-index:60}
.drawer .scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .3s ease}
.drawer aside{position:absolute;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--wall);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 24px) 24px calc(env(safe-area-inset-bottom,0px) + 24px);gap:18px;animation:slide .4s cubic-bezier(.2,.7,.2,1)}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.drawer h2{font-size:var(--step-2)}
.lines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;overflow:auto;flex:1}
.lines li{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:14px}
.lines img{width:64px;aspect-ratio:4/5;object-fit:cover;display:block}
.lines .nm{font-family:var(--display);font-size:var(--step-1)}
.lines .pr{font-variant-numeric:tabular-nums;color:var(--ink-soft);font-size:.9rem}
.lines .rm{background:none;border:0;font-size:var(--step--1);color:var(--ink-soft);text-decoration:underline}
.total{display:flex;justify-content:space-between;font-family:var(--display);font-size:var(--step-1);font-variant-numeric:tabular-nums;border-top:1px solid var(--ink);padding-top:14px}
.empty{color:var(--ink-soft);margin:0}
.msg{background:var(--wall-2);padding:14px 16px;font-size:.92rem;margin:0}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="mark" href="#top">FB <i>atelier</i></a>
    <nav class="nav" aria-label="Menu">
      <a class="nl" href="#opere" data-i18n="nav.works"></a>
      <a class="nl" href="#federica" data-i18n="nav.about"></a>
      <a class="nl" href="#atelier" data-i18n="nav.atelier"></a>
      <div class="lang" role="group" aria-label="Lingua / Language">
        <button type="button" data-lang="it" aria-pressed="true">IT</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <button type="button" class="bag-btn" id="openCart"><span data-i18n="nav.bag"></span><span class="n" id="cartCount" data-zero>0</span></button>
    </nav>
  </div>
</header>

<main id="top">
  <section class="hero wrap">
    <div class="eyebrow" data-i18n="hero.eyebrow"></div>
    <h1 data-i18n-html="hero.title"></h1>
    <p data-i18n="hero.text"></p>
    <div class="rule" data-i18n="hero.rule"></div>
  </section>

  <section class="wrap" id="opere" aria-labelledby="opere-h">
    <div class="section-head">
      <h2 id="opere-h" data-i18n="works.title"></h2>
      <p data-i18n="works.text"></p>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <section class="story" id="federica" aria-labelledby="fed-h">
    <div class="wrap">
      <figure class="portrait">
        <div class="frame"><img src="assets/img/federica.jpg" alt="Federica, fondatrice di FB atelier" width="432" height="540"></div>
        <figcaption data-i18n="story.caption"></figcaption>
      </figure>
      <div class="text">
        <div class="eyebrow" data-i18n="story.eyebrow"></div>
        <h2 id="fed-h" data-i18n="story.title"></h2>
        <p class="lede" data-i18n="story.lede"></p>
        <div id="storyBody"></div>
      </div>
    </div>
  </section>

  <section class="method wrap" id="atelier" aria-labelledby="at-h">
    <div class="section-head">
      <h2 id="at-h" data-i18n="atelier.title"></h2>
      <p data-i18n="atelier.text"></p>
    </div>
    <div class="cols">
      <figure><img src="assets/img/atelier-telaio.jpg" alt="" loading="lazy" width="1200" height="1600"><figcaption data-i18n="atelier.cap1"></figcaption></figure>
      <figure><img src="assets/img/atelier-lavoro.jpg" alt="" loading="lazy" width="1600" height="1200"><figcaption data-i18n="atelier.cap2"></figcaption></figure>
      <div class="promise" id="promise"></div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span>FB atelier · Roma</span>
    <span data-i18n="footer"></span>
  </div>
</footer>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="scrim" data-close></div>
  <article class="panel">
    <button type="button" class="close" data-close aria-label="Chiudi">×</button>
    <div class="viewer">
      <img class="main" id="sheetImg" alt="">
      <div class="thumbs" id="sheetThumbs"></div>
    </div>
    <div class="info">
      <span class="unique" data-i18n="detail.unique"></span>
      <h2 id="sheetTitle"></h2>
      <div class="desc" id="sheetDesc"></div>
      <dl class="specs" id="sheetSpecs"></dl>
      <div class="buy">
        <div class="price" id="sheetPrice"></div>
        <button type="button" class="btn" id="sheetAdd"></button>
        <p class="note" data-i18n="detail.note"></p>
      </div>
    </div>
  </article>
</div>

<div class="drawer" id="drawer" hidden role="dialog" aria-modal="true" aria-labelledby="cartTitle">
  <div class="scrim" data-close-cart></div>
  <aside>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
      <h2 id="cartTitle" data-i18n="cart.title"></h2>
      <button type="button" class="close" style="position:static" data-close-cart aria-label="Chiudi">×</button>
    </div>
    <ul class="lines" id="cartLines"></ul>
    <p class="empty" id="cartEmpty" data-i18n="cart.empty"></p>
    <div id="cartFoot">
      <div class="total"><span data-i18n="cart.total"></span><span id="cartTotal"></span></div>
      <p class="note" style="margin-top:10px" data-i18n="cart.lead"></p>
      <button type="button" class="btn" style="width:100%;margin-top:14px" id="checkout" data-i18n="cart.checkout"></button>
      <p class="msg" id="checkoutMsg" hidden data-i18n="cart.soon"></p>
    </div>
  </aside>
</div>

  "After high school she chose philosophy and graduated with honours from Sapienza University of Rome. A master's in Public Relations followed, then a brilliant career in corporate and institutional communications, all the way to management roles.",
  "Two years ago, she changed course. Federica chose to make room for a dream she had always carried: creativity, fashion and a love of craftsmanship. She opened her own atelier of handmade bags, working with crochet, loom and fabric.",
  "Before starting, she studied, as is her nature: courses in crochet and loom weaving, long conversations with people who live the craft every day, every piece of knowledge gathered with care. Today she brings passion, taste and an almost stubborn attention to detail to every piece.",
  "Her goal is clear: to design and make, with her own hands, a truly artisanal collection. Larger volumes can wait. Quality comes first, along with the wish to create something genuinely unique."

const IMG=p=>"assets/img/"+p;
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let lang=store.get("fb-lang",null)||((navigator.language||"it").toLowerCase().startsWith("it")?"it":"en");
let cart=store.get("fb-cart",[]).filter(id=>WORKS.some(w=>w.id===id));
let current=null,lastFocus=null;
const eur=n=>new Intl.NumberFormat(lang==="it"?"it-IT":"en-GB",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n);
const t=k=>T[lang][k];

function renderGrid(){
  $("#grid").innerHTML=WORKS.map(w=>{const c=w[lang];return `
  <button type="button" class="work" data-id="${w.id}" aria-label="${c.name} — ${t("works.look")}">
    <div class="frame"><img src="${IMG(w.img[0])}" alt="${c.name}" width="1000" height="1250" loading="lazy"></div>
    <div class="label"><span class="no">${w.no}</span><h3>${c.name}</h3><span class="meta">${c.place}</span></div>
    <span class="look">${t("works.look")}</span>
  </button>`}).join("");
}
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{el.textContent=t(el.dataset.i18n)});
  document.querySelectorAll("[data-i18n-html]").forEach(el=>{el.innerHTML=t(el.dataset.i18nHtml)});
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  document.querySelectorAll(".close").forEach(b=>b.setAttribute("aria-label",t("close")));
  $("#storyBody").innerHTML=t("story.body").map(p=>`<p>${p}</p>`).join("");
  $("#promise").innerHTML=t("promise").map(([h,p])=>`<div><h3>${h}</h3><p>${p}</p></div>`).join("");
  renderGrid();renderCart();if(current)fillSheet(current);
}
function fillSheet(w){
  const c=w[lang];
  $("#sheetTitle").textContent=c.name;
  $("#sheetDesc").innerHTML=c.desc.map(p=>`<p>${p}</p>`).join("");
  $("#sheetSpecs").innerHTML=[["spec.ref",`N. ${w.no} · ${c.place}`],["spec.tech",c.tech],["spec.mat",c.mat],["spec.close",c.det]].map(([k,v])=>`<dt>${t(k)}</dt><dd>${v}</dd>`).join("");
  $("#sheetPrice").textContent=eur(w.price);
  const inCart=cart.includes(w.id),b=$("#sheetAdd");
  b.textContent=inCart?t("detail.added"):t("detail.add");b.disabled=inCart;
  $("#sheetImg").alt=c.name;
  $("#sheetThumbs").innerHTML=w.img.length>1?w.img.map((p,i)=>`<button type="button" data-src="${IMG(p)}" aria-label="${c.name} ${i+1}" aria-current="${i===0}"><img src="${IMG(p)}" alt=""></button>`).join(""):"";
}
function openSheet(id){
  current=WORKS.find(w=>w.id===id);if(!current)return;
  lastFocus=document.activeElement;
  $("#sheetImg").src=IMG(current.img[0]);
  fillSheet(current);
  $("#sheet").hidden=false;document.body.style.overflow="hidden";
  $("#sheet .close").focus();
}
function closeSheet(){$("#sheet").hidden=true;current=null;document.body.style.overflow="";lastFocus&&lastFocus.focus()}
function renderCart(){
  const items=cart.map(id=>WORKS.find(w=>w.id===id));
  const n=$("#cartCount");n.textContent=items.length;items.length?n.removeAttribute("data-zero"):n.setAttribute("data-zero","");
  $("#cartLines").innerHTML=items.map(w=>`<li><img src="${IMG(w.img[0])}" alt=""><div><div class="nm">${w[lang].name}</div><div class="pr">${eur(w.price)}</div></div><button type="button" class="rm" data-rm="${w.id}">${t("cart.remove")}</button></li>`).join("");
  $("#cartEmpty").hidden=items.length>0;$("#cartFoot").hidden=!items.length;
  $("#cartTotal").textContent=eur(items.reduce((s,w)=>s+w.price,0));
}
function openCart(){lastFocus=document.activeElement;$("#checkoutMsg").hidden=true;$("#drawer").hidden=false;document.body.style.overflow="hidden";$("#drawer .close").focus()}
function closeCart(){$("#drawer").hidden=true;if($("#sheet").hidden)document.body.style.overflow="";lastFocus&&lastFocus.focus()}

$("#grid").addEventListener("click",e=>{const b=e.target.closest(".work");if(b)openSheet(b.dataset.id)});
$("#sheet").addEventListener("click",e=>{
  if(e.target.closest("[data-close]"))return closeSheet();
  const th=e.target.closest(".thumbs button");
  if(th){$("#sheetImg").src=th.dataset.src;document.querySelectorAll(".thumbs button").forEach(x=>x.setAttribute("aria-current",x===th))}
});
$("#sheetAdd").addEventListener("click",()=>{if(current&&!cart.includes(current.id)){cart.push(current.id);store.set("fb-cart",cart);renderCart();fillSheet(current)}});
$("#openCart").addEventListener("click",openCart);
$("#drawer").addEventListener("click",e=>{
  if(e.target.closest("[data-close-cart]"))return closeCart();
  const rm=e.target.closest("[data-rm]");
  if(rm){cart=cart.filter(id=>id!==rm.dataset.rm);store.set("fb-cart",cart);renderCart();if(current)fillSheet(current)}
});
$("#checkout").addEventListener("click",()=>{$("#checkoutMsg").hidden=false});
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang;store.set("fb-lang",lang);applyLang()}));
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(!$("#drawer").hidden)closeCart();else if(!$("#sheet").hidden)closeSheet()}});
applyLang();
</script>
</body>
</html>
